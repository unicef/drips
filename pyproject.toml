[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "drips"
version = "0.2"
description = "DRIPS - Donor Reporting Portal"
readme = "README.rst"
license = { text = "AGPL-3.0" }
authors = [
  { name = "UNICEF", email = "drips@unicef.org" },
]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "celery",
  "dj-database-url",
  "dj-static",
  "django~=6.0",
  "django-admin-extra-buttons",
  "django-adminactions",
  "django-celery-beat",
  "django-celery-email",
  "django-celery-results",
  "django-cors-headers",
  "django-debug-toolbar",
  "django-environ",
  "django-extensions",
  "django-filter",
  "django-picklefield",
  "django-redis-cache",
  "django-rest-framework-social-oauth2",
  "djangorestframework",
  "djangorestframework-csv",
  "djangorestframework-recursive",
  "djangorestframework-simplejwt",
  "djangorestframework-xml",
  "gunicorn",
  "newrelic",
  "psycopg2-binary",
  "requests",
  "sentry-sdk",
  "sharepoint-rest-api",
  "social-auth-app-django",
  "social-auth-core",
  "unicef-djangolib",
  "unicef-notification",
  "unicef-realm",
  "unicef-security",
  "unicef-vision",
  "uwsgi",
]

[dependency-groups]
dev = [
  "coverage",
  "django-webtest",
  "drf-api-checker",
  "factory-boy",
  "freezegun",
  "ipython",
  "mock",
  "pdbpp",
  "pre-commit",
  "pytest",
  "pytest-coverage",
  "pytest-django",
  "pytest-echo",
  "pytest-env",
  "pytest-ignore-flaky",
  "pytest-pythonpath",
  "responses",
  "ruff",
  "sphinx",
  "vcrpy",
  "webtest",
]

[tool.setuptools]
packages.find.where = [ "src" ]
package-dir."" = "src"

[tool.ruff]
target-version = "py314"
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [
  "A",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DJ",
  "E",
  "E4",
  "E7",
  "E9",
  "ERA",
  "F",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "Q",
  "R",
  "RET",
  "S",
  "SIM",
  "T10",
  "T20",
  "TC",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "ANN401",
  "B904",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "DJ001",
  "E731",
  "I001",
  "ISC001",
  "PLR2004",
  "RUF005",
  "RUF012",
  "SIM108",
  "UP031",
  "UP035",
  "UP037",
]
lint.per-file-ignores."src/**/migrations/**.py" = [ "E501", "ERA001" ]
lint.per-file-ignores."src/drips/config/settings.py" = [ "ERA001", "S104", "S108" ]
lint.per-file-ignores."src/drips/config/wsgi.py" = [ "ERA001" ]
lint.per-file-ignores."src/sharepoint_sync/**" = [ "ERA001" ]
lint.per-file-ignores."tests/**.py" = [
  "ANN",
  "D",
  "ERA001",
  "N999",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "S",
  "S101",
  "SIM117",
  "UP"
]
